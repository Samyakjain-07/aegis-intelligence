[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-shared"
version = "0.1.0"
description = "Small, dependency-free types shared between services/api and services/ingestion (Aegis Intelligence)."
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis_shared*"]

[tool.setuptools.package-data]
aegis_shared = ["py.typed"]
